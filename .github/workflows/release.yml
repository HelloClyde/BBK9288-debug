name: Build and release 9288 Debug

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Windows client and 9288 resident service
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        id: msys2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Expose MinGW GCC to native host tests
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $gcc = Get-Item "$env:MSYS2_LOCATION\ucrt64\bin\gcc.exe"
          $gcc.DirectoryName >> $env:GITHUB_PATH
      - run: python -m pip install -r requirements-build.txt
      - run: python scripts/audit_source.py
      - name: Fetch hash-pinned build-only headers and native compiler
        run: python scripts/fetch_build_dependencies.py
      - name: Test host, actual S1C33 compilation and relocation model
        env:
          D88_TOOLCHAIN: ${{ github.workspace }}/build/dependencies/toolchain
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build device, frozen GUI, notices and installation ZIP
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            python scripts/build_release.py --tag "$env:GITHUB_REF_NAME"
          } else {
            python scripts/build_release.py
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_release.py dist/release --source-sha "$env:GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BBK9288-debug-release
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish verified prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: BBK9288-debug-release
          path: release-assets
      - name: Verify exact assets, checksums, commit and version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: python scripts/verify_release.py release-assets --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA"
      - name: Publish same-run assets without overwriting existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite it.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --prerelease \
            --title "9288 Debug $RELEASE_TAG（实验预发布）" --notes-file docs/release-notes.md
